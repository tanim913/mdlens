# Builds the Windows installer and attaches it to the release for package.json's version.
# The Ubuntu .deb is still built locally with `npm run dist`; this workflow never touches it.
name: Windows build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mdlens-windows
          path: dist/*.exe
      - name: Attach to the release, if it exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.exe --clobber
          else
            echo "No release $tag yet; the installer is in this run's artifacts."
          fi
